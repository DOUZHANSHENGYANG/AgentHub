[package]
name = "agenthub"
version = "0.1.0"
description = "AgentHub — unified manager for AI prompts, MCP servers and skills"
authors = ["you"]
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# this feature is used for production builds — embeds frontend assets into the binary
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4" }
dirs = "6"
toml = "0.8"
sha2 = "0.10"
ureq = { version = "2", features = ["json"] }
serde_yaml_ng = "0.10.0"
zip = { version = "9.0.4", default-features = false, features = ["deflate"] }
# 改写文件时间戳：ZIP 的 DOS 纪元哨兵值（1980-01-01）需要被替换为可信时间
filetime = "0.2"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
